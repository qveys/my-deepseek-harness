name: deepseek-harness

# Both services run the same image; DEEPSEEK_API_KEY and the optional
# DEEPSEEK_BASE_URL come from the shell or from the root .env, which stays out of
# the image. Named volumes retain settings, sessions, and workspace files.
# Set DSH_WORKSPACE to an existing absolute directory to work on a host tree.
x-dsh: &dsh
  build: .
  image: deepseek-harness:dev
  init: true
  working_dir: /workspace
  environment:
    - DEEPSEEK_API_KEY
    - DEEPSEEK_BASE_URL
  volumes:
    - dsh-home:/home/node/.dsh
    - ${DSH_WORKSPACE:-dsh-workspace}:/workspace

services:
  # Web UI: `docker compose up`, then open the tokenized URL printed in the log
  # (`docker compose logs dsh`) — the index rejects a request without its token.
  dsh:
    <<: *dsh
    command: ["--profile", "web", "--no-open", "--port", "${DSH_PORT:-3080}"]
    # 3081 is the relay's port, not the server's: dsh binds loopback and rejects
    # `--host 0.0.0.0`, and publishing on the host's loopback keeps the exposure
    # the product intends. The browser and server use the same DSH_PORT so the
    # /api trust fence accepts the published authority.
    ports:
      - "127.0.0.1:${DSH_PORT:-3080}:3081"

  # Loopback-to-published relay, the container equivalent of the SSH forward the
  # Web guide describes. Remove this service to keep the UI unreachable.
  web-relay:
    image: alpine/socat:latest
    network_mode: "service:dsh"
    depends_on:
      - dsh
    command: TCP-LISTEN:3081,fork,reuseaddr TCP:127.0.0.1:${DSH_PORT:-3080}

  # One-shot task, run on demand:
  #   docker compose run --rm headless "run the tests"
  headless:
    <<: *dsh
    entrypoint: ["node", "/app/apps/cli/lib/bin.js", "--profile", "headless"]
    profiles: ["cli"]

volumes:
  dsh-home:
  dsh-workspace:
